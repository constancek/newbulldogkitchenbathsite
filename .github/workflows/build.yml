# Rebuilds the site whenever the source (src/) or a photo (images/) changes, on any branch,
# fetches the photo for any new blog post from Pexels, and commits the generated public/
# folder (plus any fetched photo) back. Nobody needs Node or ffmpeg on their own
# computer: edit a Markdown post or upload a photo on GitHub, and this does the rest.
#
# Merging a blog post's pull request publishes it: on main, src/publish-posts.js first stamps
# any newly merged post with the day it went live. On other branches the build is marked as a
# preview, so the Vercel preview of a pull request says so on every post.
# After a main build, the sync-drafts job below merges main into every open blog/ branch, so
# a waiting post never shows "This branch has conflicts" over the generated files.
name: Build site

on:
  push:
    paths:
      - 'src/**'
      - 'images/**'
      - '.github/workflows/build.yml'
  # Run by hand from the Actions tab (for example after adding the PEXELS_API_KEY secret, to
  # fetch photos for posts that are still on the placeholder)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Skip the commit this workflow itself makes
    if: "!contains(github.event.head_commit.message, '[skip build]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ffmpeg (converts photos to WebP)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # A new post gets its one photo from Pexels (searched by the post's photo: line) the first
      # time it is pushed. Needs the PEXELS_API_KEY repository secret; without it the post keeps
      # the placeholder and the build still passes.
      - name: Fetch blog photos from Pexels
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node src/fetch-blog-photo.js

      - name: Stamp newly published posts with today's date (main only)
        if: github.ref_name == 'main'
        run: node src/publish-posts.js

      - name: Build
        env:
          PREVIEW_BUILD: ${{ github.ref_name == 'main' && '0' || '1' }}
        run: node src/build.js

      - name: Commit the generated site
        run: |
          git config user.name "site-build"
          git config user.email "site-build@users.noreply.github.com"
          git add -A public images src/content/blog
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Build site [skip build]"
            git push
          fi

  # After main changes, bring every open blog/ pull request up to date with it, so the generated
  # public/ files (blog index, sitemap) never conflict when the reviewer clicks Merge. Each
  # branch gets main merged in and its preview rebuilt here, since a push made with the
  # workflow token does not start another run.
  sync-drafts:
    needs: build
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ffmpeg (converts photos to WebP)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Merge main into open blog branches and rebuild their previews
        env:
          GH_TOKEN: ${{ github.token }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          git config user.name "site-build"
          git config user.email "site-build@users.noreply.github.com"
          for b in $(gh pr list --state open --limit 100 --json headRefName --jq '.[].headRefName | select(startswith("blog/"))'); do
            echo "== $b"
            git checkout -q -B "$b" "origin/$b"
            if git merge-base --is-ancestor origin/main HEAD; then echo "already up to date"; continue; fi
            if ! git merge --no-ff --no-commit --no-edit origin/main >/dev/null 2>&1; then
              conflicts=$(git diff --name-only --diff-filter=U)
              if echo "$conflicts" | grep -qv '^public/\|^images/.converted.json$'; then
                echo "::warning::$b conflicts with main outside the generated files; leaving it for a person:"; echo "$conflicts"
                git merge --abort; continue
              fi
              # Only generated files conflict: take main's copy, the rebuild below replaces them anyway
              echo "$conflicts" | xargs git checkout --theirs --
              echo "$conflicts" | xargs git add --
            fi
            node src/fetch-blog-photo.js
            PREVIEW_BUILD=1 node src/build.js
            git add -A public images src/content/blog
            git commit -q -m "Merge main into $b [skip build]"
            git push -q origin "$b"
            echo "updated"
          done
